{
  "openapi": "3.1.0",
  "info": {
    "title": "Varity Public Platform API",
    "version": "2026-07-25",
    "description": "Gateway-owned resource API for deploying and operating Varity apps."
  },
  "servers": [
    {
      "url": "https://varity.app/api"
    }
  ],
  "security": [
    {
      "ApiKeyAuth": []
    }
  ],
  "paths": {
    "/deployment-profiles": {
      "get": {
        "operationId": "getDeploymentProfiles",
        "summary": "Get normalized deployment profiles",
        "description": "Returns customer-facing profiles, prices, and aggregate availability without exposing supplier identity or native inventory.",
        "parameters": [
          {
            "name": "workload",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "gpu",
                "cpu"
              ]
            }
          },
          {
            "name": "execution_class",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "container",
                "virtual_machine",
                "bare_metal",
                "cpu_virtual_machine"
              ]
            }
          },
          {
            "name": "contract_version",
            "in": "query",
            "required": false,
            "description": "Request the resource-, location-, runtime-, and access-complete GPU container catalog. Omit during a rolling v1 compatibility window.",
            "schema": {
              "const": "gpu-container-profiles-v2"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Normalized GPU deployment profile catalog",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/GpuContainerProfileCatalogV1"
                    },
                    {
                      "$ref": "#/components/schemas/GpuContainerProfileCatalog"
                    },
                    {
                      "$ref": "#/components/schemas/MachineProfileCatalog"
                    }
                  ]
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/pricing/accelerator-quote": {
      "post": {
        "operationId": "issueAcceleratorQuote",
        "summary": "Issue an exact hourly accelerator quote for a GPU workload",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/PrepareGpuContainerQuoteRequest"
                  },
                  {
                    "$ref": "#/components/schemas/CreateApplicationDeploymentRequest"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Exact quote",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AcceleratorQuote"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/pricing/machine-quote": {
      "post": {
        "operationId": "issueMachineQuote",
        "summary": "Issue an exact quote for a self-managed machine",
        "description": "Resolves the selected Varity profile and OS image against current normalized inventory and its exact customer price.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MachineQuoteRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Exact owner-bound machine quote",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MachineQuote"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/machines": {
      "get": {
        "operationId": "listMachines",
        "summary": "List owner-scoped self-managed machines",
        "responses": {
          "200": {
            "description": "Normalized owner machine inventory",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "machines"
                  ],
                  "properties": {
                    "machines": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Machine"
                      }
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "post": {
        "operationId": "createMachine",
        "summary": "Create a self-managed machine",
        "description": "Accepts a Varity profile, normalized OS image, and SSH public key. Supplier identity and native infrastructure identifiers are never public.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128,
              "pattern": "^[A-Za-z0-9._:-]+$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateMachineRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Machine operation accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MachineAcceptance"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/machines/{machine_id}/actions": {
      "post": {
        "operationId": "runMachineAction",
        "summary": "Run a bounded synchronous action on one machine",
        "description": "Restarts or soft-reboots the machine in place. Not a durable operation: the machine keeps its identity, access, and billing.",
        "parameters": [
          {
            "name": "machine_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MachineActionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Observed machine state after the action was applied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MachineActionResult"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/machines/{machine_id}": {
      "get": {
        "operationId": "getMachine",
        "summary": "Get one owner-scoped self-managed machine",
        "parameters": [
          {
            "name": "machine_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Normalized machine lifecycle, access, and billing truth",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Machine"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "delete": {
        "operationId": "deleteMachine",
        "summary": "Delete one owner-scoped self-managed machine",
        "description": "Acceptance is not closure proof. Allocation, SSH access, and billing closure reconcile independently.",
        "parameters": [
          {
            "name": "machine_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128,
              "pattern": "^[A-Za-z0-9._:-]+$"
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Machine deletion accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MachineAcceptance"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployment-capabilities": {
      "get": {
        "operationId": "getDeploymentCapabilities",
        "summary": "Get the provider-neutral deployment catalog",
        "description": "Returns user-visible workload and execution choices with their current availability. Live inventory and implementation-specific identifiers are not part of this contract.",
        "responses": {
          "200": {
            "description": "Deployment capability catalog",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeploymentCapabilities"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments": {
      "get": {
        "operationId": "listDeployments",
        "summary": "List deployments",
        "responses": {
          "200": {
            "description": "Deployment list",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeploymentList"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "post": {
        "operationId": "createDeployment",
        "summary": "Create a deployment",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateDeploymentRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Deployment accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AcceptedDeployment"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/runs/{run_id}": {
      "get": {
        "operationId": "getDeploymentRun",
        "summary": "Get deployment run status",
        "parameters": [
          {
            "$ref": "#/components/parameters/RunId"
          },
          {
            "name": "app",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Deployment run status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeploymentRunStatus"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}": {
      "get": {
        "operationId": "getDeployment",
        "summary": "Get a deployment",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Deployment",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "deployment"
                  ],
                  "properties": {
                    "deployment": {
                      "$ref": "#/components/schemas/Deployment"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "delete": {
        "operationId": "deleteDeployment",
        "summary": "Delete a deployment",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Deployment deleted",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "id",
                    "status",
                    "deleted"
                  ],
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "status": {
                      "const": "deleted"
                    },
                    "deleted": {
                      "const": true
                    }
                  }
                }
              }
            }
          },
          "202": {
            "description": "Deletion accepted (durable path): route removal, compute close, and billing stop reconcile as distinct durable facts.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "id",
                    "status",
                    "deleted",
                    "run_id",
                    "status_url"
                  ],
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "app_name": {
                      "type": "string"
                    },
                    "subdomain": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "status": {
                      "type": "string",
                      "enum": [
                        "deleting",
                        "deleted"
                      ]
                    },
                    "deleted": {
                      "type": "boolean"
                    },
                    "run_id": {
                      "type": "string"
                    },
                    "status_url": {
                      "type": "string"
                    },
                    "replayed": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/domain": {
      "get": {
        "operationId": "getDeploymentDomain",
        "summary": "Read custom-domain state",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Custom-domain state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CustomDomainEnvelope"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "put": {
        "operationId": "attachDeploymentDomain",
        "summary": "Attach one hostname (subdomain CNAME or apex A + TXT)",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "hostname"
                ],
                "properties": {
                  "hostname": {
                    "type": "string",
                    "examples": [
                      "app.example.com",
                      "example.com"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Custom domain attached",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CustomDomainEnvelope"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "delete": {
        "operationId": "removeDeploymentDomain",
        "summary": "Remove the custom hostname",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Custom domain removed"
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/domain/verify": {
      "post": {
        "operationId": "verifyDeploymentDomain",
        "summary": "Observe DNS and verify HTTPS serving",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Updated custom-domain state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CustomDomainEnvelope"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/redeploy": {
      "post": {
        "operationId": "redeployDeployment",
        "summary": "Redeploy in place",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "202": {
            "description": "Redeploy accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AcceptedMutation"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/restart": {
      "post": {
        "operationId": "restartDeployment",
        "summary": "Restart a deployment as a verified replacement",
        "description": "Provisions a fresh verified replacement from the saved deployment configuration: the current version keeps serving until the replacement passes health and routing checks, then traffic switches atomically. Deployments that cannot be reconstructed from saved configuration answer 409; where the platform cannot restart at all it answers 501.",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "202": {
            "description": "Restart accepted",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status",
                    "run_id",
                    "status_url"
                  ],
                  "properties": {
                    "status": {
                      "const": "restarting"
                    },
                    "run_id": {
                      "type": "string"
                    },
                    "status_url": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/PublicError"
          },
          "501": {
            "$ref": "#/components/responses/PublicError"
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/logs": {
      "get": {
        "operationId": "listDeploymentLogs",
        "summary": "Read deployment logs",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000,
              "default": 200
            }
          },
          {
            "name": "since_seq",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Deployment logs",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LogList"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/events": {
      "get": {
        "operationId": "listDeploymentEvents",
        "summary": "Read deployment events",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Deployment events",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventList"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/health-history": {
      "get": {
        "operationId": "readDeploymentHealthHistory",
        "summary": "Read durable runtime and route health history",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500,
              "default": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Durable health history",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthHistory"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/deployments/{deployment_id}/env": {
      "get": {
        "operationId": "listDeploymentEnv",
        "summary": "List environment variable keys",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "responses": {
          "200": {
            "description": "Environment variable keys",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvKeyList"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      },
      "patch": {
        "operationId": "patchDeploymentEnv",
        "summary": "Update environment variables",
        "parameters": [
          {
            "$ref": "#/components/parameters/DeploymentId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EnvUpdateRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Update accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AcceptedMutation"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/templates": {
      "get": {
        "operationId": "listTemplates",
        "summary": "List templates",
        "responses": {
          "200": {
            "description": "Template list",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TemplateList"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/templates/{template_id}": {
      "get": {
        "operationId": "getTemplate",
        "summary": "Get a template",
        "parameters": [
          {
            "$ref": "#/components/parameters/TemplateId"
          }
        ],
        "responses": {
          "200": {
            "description": "Template",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "template"
                  ],
                  "properties": {
                    "template": {
                      "$ref": "#/components/schemas/Template"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/PublicError"
          }
        }
      }
    },
    "/templates/{template_id}/deploy": {
      "post": {
        "operationId": "deployTemplate",
        "summary": "Deploy a template",
        "parameters": [
          {
            "$ref": "#/components/parameters/TemplateId"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TemplateDeployRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
