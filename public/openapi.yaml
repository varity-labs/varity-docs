  "components": {
    "securitySchemes": {
      "ApiKeyAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Varity API key"
      },
      "PortalSession": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Developer Portal session credential"
      }
    },
    "parameters": {
      "DeploymentId": {
        "name": "deployment_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "RunId": {
        "name": "run_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "TemplateId": {
        "name": "template_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "AttachmentId": {
        "name": "attachment_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^vai_[A-Za-z0-9_-]{20,64}$"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "maxLength": 160
        }
      },
      "RequiredIdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 160,
          "pattern": "^[A-Za-z0-9._:-]+$"
        }
      }
    },
    "responses": {
      "PublicError": {
        "description": "Public API error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/PublicError"
            }
          }
        }
      }
    },
    "schemas": {
      "CreateGpuContainerRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "execution_class",
          "profile_id",
          "ssh_public_key",
          "accelerator_quote_token"
        ],
        "properties": {
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
          },
          "execution_class": {
            "const": "container"
          },
          "profile_id": {
            "type": "string",
            "pattern": "^gpo-[0-9a-f]{24}$"
          },
          "ssh_public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 10000,
            "writeOnly": true,
            "description": "OpenSSH public key. Private key material is forbidden."
          },
          "accelerator_quote_token": {
            "type": "string",
            "minLength": 16,
            "maxLength": 8192,
            "writeOnly": true
          }
        }
      },
      "PrepareGpuContainerQuoteRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "execution_class",
          "profile_id"
        ],
        "properties": {
          "execution_class": {
            "const": "container"
          },
          "profile_id": {
            "type": "string",
            "pattern": "^gpo-[0-9a-f]{24}$"
          }
        }
      },
      "GpuContainerProfileCatalogV1": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "workload",
          "execution_class",
          "profiles"
        ],
        "properties": {
          "schema_version": {
            "const": "gpu-container-profiles-v1"
          },
          "workload": {
            "const": "gpu"
          },
          "execution_class": {
            "const": "container"
          },
          "profiles": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/GpuContainerProfileV1"
            }
          }
        }
      },
      "GpuContainerProfileV1": {
        "type": "object",
        "additionalProperties": false,
        "description": "Rolling-release compatibility profile. Request v2 before presenting this profile as deployable.",
        "required": [
          "id",
          "label",
          "execution_class",
          "accelerator",
          "hardware",
          "customer_price",
          "availability"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/GpuContainerProfile/properties/id"
          },
          "label": {
            "$ref": "#/components/schemas/GpuContainerProfile/properties/label"
          },
          "execution_class": {
            "const": "container"
          },
          "accelerator": {
            "$ref": "#/components/schemas/AcceleratorProfileSelection"
          },
          "hardware": {
            "$ref": "#/components/schemas/GpuContainerProfile/properties/hardware"
          },
          "customer_price": {
            "$ref": "#/components/schemas/GpuContainerProfile/properties/customer_price"
          },
          "availability": {
            "$ref": "#/components/schemas/GpuProfileAvailability"
          }
        }
      },
      "GpuContainerProfileCatalog": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "workload",
          "execution_class",
          "profiles"
        ],
        "properties": {
          "schema_version": {
            "const": "gpu-container-profiles-v2"
          },
          "workload": {
            "const": "gpu"
          },
          "execution_class": {
            "const": "container"
          },
          "profiles": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/GpuContainerProfile"
            }
          }
        }
      },
      "GpuContainerProfile": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "label",
          "execution_class",
          "accelerator",
          "hardware",
          "resources",
          "locations",
          "runtime",
          "access",
          "customer_price",
          "availability"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^gpo-[0-9a-f]{24}$"
          },
          "label": {
            "type": "string"
          },
          "execution_class": {
            "const": "container"
          },
          "accelerator": {
            "$ref": "#/components/schemas/AcceleratorProfileSelection"
          },
          "hardware": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "vendor",
              "model",
              "vram_mb",
              "interface",
              "count"
            ],
            "properties": {
              "vendor": {
                "const": "NVIDIA"
              },
              "model": {
                "type": "string"
              },
              "vram_mb": {
                "type": "integer"
              },
              "interface": {
                "type": "string",
                "enum": [
                  "pcie",
                  "sxm"
                ]
              },
              "count": {
                "type": "integer",
                "minimum": 1,
                "maximum": 24
              }
            }
          },
          "resources": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "cpu_units",
              "memory_mb",
              "storage_mb"
            ],
            "properties": {
              "cpu_units": {
                "type": "number",
                "exclusiveMinimum": 0
              },
              "memory_mb": {
                "type": "integer",
                "minimum": 1
              },
              "storage_mb": {
                "type": "integer",
                "minimum": 1
              }
            }
          },
          "locations": {
            "type": "array",
            "maxItems": 256,
            "uniqueItems": true,
            "description": "Current location availability for this exact offer. Final placement is reported after activation.",
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
            }
          },
          "runtime": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "label",
              "provider_default"
            ],
            "properties": {
              "label": {
                "type": "string",
                "minLength": 1,
                "maxLength": 128
              },
              "ports": {
                "type": "array",
                "maxItems": 64,
                "uniqueItems": true,
                "items": {
                  "type": "string",
                  "pattern": "^[1-9][0-9]{0,4}/(?:tcp|udp)$"
                }
              },
              "startup_command": {
                "type": [
                  "string",
                  "null"
                ],
                "minLength": 1,
                "maxLength": 4096
              },
              "provider_default": {
                "const": true
              }
            }
          },
          "access": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "mode",
              "requires_public_key"
            ],
            "properties": {
              "mode": {
                "const": "ssh"
              },
              "requires_public_key": {
